<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon · Cards</title><link rel="stylesheet" href="shared/neon.css">
<style>
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.kpi::after{content:'';position:absolute;inset:auto -20% -70% -20%;height:90%;background:radial-gradient(closest-side,var(--gl),transparent);opacity:.3;pointer-events:none}
.kpi.gg{--gl:#2bff88}.kpi.bb{--gl:#3d8bff}.kpi.rr{--gl:#ff4d5e}
.kpi .num{font-size:clamp(26px,3.6vw,42px)}
@media(max-width:760px){.kpis{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div id="app"></div></div>
<script src="shared/core.js"></script><script>
const head=(s,H,title)=>`<header><h1><i></i>${H.esc(s.project.name)}</h1>
  ${H.config.projects.length>1?`<div class="tabs proj">${H.config.projects.map((p,i)=>`<button class="tab ${i===s.pi?'on':''}" data-project="${i}">${H.esc(p.name)}</button>`).join('')}</div>`:''}
  <div class="tabs">${(s.months||s.project.months).map((m,i)=>`<button class="tab ${i===s.mi?'on':''}" data-month="${i}">${m.label}</button>`).join('')}</div></header>`;
const guard=(s,H,h)=>s.status==='loading'?h+'<div class="status">Загрузка…</div>':s.status==='error'?h+`<div class="status err">Ошибка: ${H.esc(s.error)}<br><br><button class="tab on" data-refresh>Повторить</button></div>`:null;
const foot=s=>`<div class="foot"><span>Обновлено ${s.updated.toLocaleTimeString('ru-RU')} · Google Sheets</span><button data-refresh>↻ Обновить</button></div>`;
const totals=m=>m.total&&m.total.found!=null?{found:m.total.found,spent:m.total.spent,diff:m.total.diff}:{found:m.days.reduce((a,x)=>a+x.found,0),spent:m.days.reduce((a,x)=>a+x.spent,0),diff:m.days.reduce((a,x)=>a+x.diff,0)};
const delta=(m)=>m.delta==null?'':`<span class="badge ${m.delta<0?'neg':''}">${m.delta>=0?'▲':'▼'} ${Math.abs(m.delta*100).toFixed(0)}%</span>`;
Dash.start((s,H)=>{const h=head(s,H),g=guard(s,H,h);if(g)return g;
 const m=s.month,x=m.summary,c=s.project.currency,t=totals(m),f=H.fmt;
 const rows=m.days.map(r=>`<tr><td>${r.d} ${m.gen}</td><td class="f">${f(r.found)}</td><td class="s">${f(r.spent)}</td><td class="${r.diff<0?'n':'p'}">${f(r.diff)}</td></tr>`).join('');
 return h+`<div class="kpis">
  <div class="card kpi gg"><h3>Чистая прибыль ${delta(m)}</h3><div class="num g glow-g">${f(x.profit)}<small>${c}</small></div></div>
  <div class="card kpi bb"><h3>Всего найдено</h3><div class="num b glow-b">${f(x.found)}<small>${c}</small></div></div>
  <div class="card kpi rr"><h3>Реклама</h3><div class="num r glow-r">${f(x.spent)}<small>${c}</small></div></div></div>
  <div class="card" style="padding:14px 10px 8px">${m.days.length?`<div class="scroll"><table><thead><tr><th>День</th><th>Найдено</th><th>Потрачено</th><th>Разница</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Итого</td><td class="f">${f(t.found)}</td><td class="s">${f(t.spent)}</td><td class="p">${f(t.diff)}</td></tr></tfoot></table></div>`:'<div class="status">Для этого месяца есть только итоги</div>'}</div>`+foot(s);});
</script></body></html>
