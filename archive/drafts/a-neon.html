<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд — Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a10;--panel:#0e131c;--line:#1b2433;--tx:#e8eef7;--mute:#7b8aa3;--g:#2bff88;--b:#3d8bff;--r:#ff4d5e}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,#12304a55,transparent),radial-gradient(700px 420px at -5% 10%,#0f3a2a44,transparent),var(--bg);color:var(--tx);font:15px/1.4 'Space Grotesk',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:.02em}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--b));box-shadow:0 0 24px #2bff8855}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--mute);padding:8px 16px;border-radius:99px;font:inherit;cursor:pointer;transition:.15s}
.tab:hover{color:var(--tx);border-color:#2c3a52}
.tab.on{color:#04120a;background:var(--g);border-color:var(--g);box-shadow:0 0 22px #2bff8844;font-weight:700}
.proj{display:flex;gap:8px;align-items:center}.proj .tab{padding:6px 12px;font-size:13px}.proj .tab.on{background:var(--b);border-color:var(--b);color:#fff;box-shadow:0 0 20px #3d8bff55}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.card{background:linear-gradient(180deg,#111826,var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px 22px;position:relative;overflow:hidden}
.card h3{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi .v{font:600 clamp(26px,3.4vw,40px)/1 'JetBrains Mono',monospace;letter-spacing:-.02em}
.kpi .v small{font-size:.42em;color:var(--mute);margin-left:6px;font-weight:400}
.kpi::after{content:'';position:absolute;inset:auto -20% -60% -20%;height:90%;background:radial-gradient(closest-side,var(--glow),transparent);opacity:.35;pointer-events:none}
.kpi.g{--glow:#2bff88}.kpi.g .v{color:var(--g);text-shadow:0 0 28px #2bff8866}
.kpi.b{--glow:#3d8bff}.kpi.b .v{color:var(--b);text-shadow:0 0 28px #3d8bff66}
.kpi.r{--glow:#ff4d5e}.kpi.r .v{color:var(--r);text-shadow:0 0 28px #ff4d5e66}
.badge{font:600 12px 'JetBrains Mono',monospace;padding:3px 8px;border-radius:99px;background:#2bff8820;color:var(--g)}.badge.neg{background:#ff4d5e20;color:var(--r)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat .n{font:600 22px 'JetBrains Mono',monospace}.stat .l{color:var(--mute);font-size:12px;margin-top:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
svg.chart{width:100%;height:auto;display:block}
.grid{stroke:#1b2433;stroke-width:1}.zero{stroke:#2c3a52}.axis{fill:var(--mute);font:10px 'JetBrains Mono',monospace}.axis.val{fill:var(--tx);font-weight:600}
.c-found{fill:var(--b)}.c-spent{fill:var(--r)}.c-profit{fill:var(--g)}
.c-profit-line{stroke:var(--g);stroke-width:2.2;filter:drop-shadow(0 0 5px #2bff88)}.c-profit-dot{fill:var(--bg);stroke:var(--g);stroke-width:1.6}
.c-profit-area{fill:url(#ag)}
.col .hit{fill:transparent}.col:hover .hit{fill:#ffffff0a}.col:hover .bar{filter:brightness(1.3)}
.mbar{opacity:.45}.mbar.on{opacity:1;filter:drop-shadow(0 0 8px #2bff88aa)}
.ring-bg{stroke:#1b2433}.ring-fg{stroke:var(--r);filter:drop-shadow(0 0 6px #ff4d5e)}
.ringbox{display:flex;align-items:center;gap:18px}.ringbox .ring{width:110px}.ringbox b{font:600 26px 'JetBrains Mono',monospace}
table{width:100%;border-collapse:collapse;font:13px 'JetBrains Mono',monospace}
th{color:var(--mute);font-weight:400;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase}th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;text-align:right;border-bottom:1px solid #121a27}tr:hover td{background:#ffffff06}
td.p{color:var(--g)}td.n{color:var(--r)}td.f{color:var(--b)}
.scroll{max-height:420px;overflow:auto}
.status{color:var(--mute);padding:80px 0;text-align:center}.status.err{color:var(--r)}
.foot{margin-top:18px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between}.foot button{background:none;border:0;color:var(--b);cursor:pointer;font:inherit}
@media(max-width:820px){.kpis,.row{grid-template-columns:1fr}.proj{width:100%}}
</style></head><body><div class="wrap"><div id="app"></div></div>
<script src="shared/core.js"></script>
<script>
Dash.start((s,H)=>{
  const {fmt,short,pct}=H;
  const head=`<header><div class="brand"><div class="logo"></div>${H.esc(s.project.name)}</div>
    ${H.config.projects.length>1?`<div class="proj">${H.config.projects.map((p,i)=>`<button class="tab ${i===s.pi?'on':''}" data-project="${i}">${H.esc(p.name)}</button>`).join('')}</div>`:''}
    <div class="tabs">${(s.months||s.project.months).map((m,i)=>`<button class="tab ${i===s.mi?'on':''}" data-month="${i}">${m.label}</button>`).join('')}</div></header>`;
  if(s.status==='loading')return head+'<div class="status">Загружаю таблицу…</div>';
  if(s.status==='error')return head+`<div class="status err">Ошибка: ${H.esc(s.error)}<br><button class="tab" data-refresh>Повторить</button></div>`;
  const m=s.month,x=m.summary,cur=s.project.currency;
  const d=m.delta,badge=d==null?'':`<span class="badge ${d<0?'neg':''}">${d>=0?'▲':'▼'} ${Math.abs(d*100).toFixed(0)}%</span>`;
  const rows=m.days.slice().reverse().map(r=>`<tr><td>${r.d}</td><td class="f">${fmt(r.found)}</td><td class="n">${fmt(r.spent)}</td><td class="${r.diff<0?'n':'p'}">${fmt(r.diff)}</td></tr>`).join('');
  return head+`
  <div class="kpis">
   <div class="card kpi g"><h3>Чистая прибыль ${badge}</h3><div class="v">${fmt(x.profit)}<small>${cur}</small></div></div>
   <div class="card kpi b"><h3>Всего найдено</h3><div class="v">${fmt(x.found)}<small>${cur}</small></div></div>
   <div class="card kpi r"><h3>Потрачено на рекламу</h3><div class="v">${fmt(x.spent)}<small>${cur}</small></div></div>
  </div>
  <div class="row">
   <div class="card"><h3>По дням <span class="legend"><span><i style="background:var(--b)"></i>найдено</span><span><i style="background:var(--r)"></i>реклама</span><span><i style="background:var(--g)"></i>прибыль</span></span></h3>
     ${m.days.length?H.dailyChart(m.days):'<div class="status">Для этого месяца есть только итоги</div>'}</div>
   <div style="display:grid;gap:14px">
     <div class="card"><h3>Доля рекламы</h3><div class="ringbox">${H.ring(m.adShare)}<div><b>${pct(m.adShare)}</b><div style="color:var(--mute);font-size:12px">от найденного</div></div></div></div>
     <div class="card stat"><h3>ROI</h3><div class="n" style="color:var(--g)">×${m.roi.toFixed(2)}</div><div class="l">прибыль на 1 so'm рекламы</div></div>
   </div>
  </div>
  <div class="row">
   <div class="card"><h3>Накопленная прибыль</h3><svg width="0" height="0"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2bff88" stop-opacity=".35"/><stop offset="1" stop-color="#2bff88" stop-opacity="0"/></linearGradient></defs></svg>${m.days.length?H.cumulativeChart(m.days):'<div class="status">нет данных</div>'}</div>
   <div class="card"><h3>Прибыль по месяцам</h3>${H.monthsChart(s.months,m.key)}</div>
  </div>
  ${m.days.length?`<div class="row" style="grid-template-columns:1fr 2fr"><div class="card stats" style="display:grid;gap:18px">
     <div class="stat"><div class="n">${fmt(m.avgProfit)}</div><div class="l">средняя прибыль в день</div></div>
     <div class="stat"><div class="n" style="color:var(--g)">${m.best.d}-е · ${short(m.best.diff)}</div><div class="l">лучший день</div></div>
     <div class="stat"><div class="n" style="color:var(--r)">${m.worst.d}-е · ${short(m.worst.diff)}</div><div class="l">худший день</div></div>
     <div class="stat"><div class="n">${m.activeDays}</div><div class="l">дней в данных</div></div></div>
   <div class="card"><h3>Таблица</h3><div class="scroll"><table><thead><tr><th>День</th><th>Найдено</th><th>Реклама</th><th>Прибыль</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`:''}
  <div class="foot"><span>Обновлено ${s.updated.toLocaleTimeString('ru-RU')} · Google Sheets</span><button data-refresh>↻ Обновить</button></div>`;
});
</script></body></html>
