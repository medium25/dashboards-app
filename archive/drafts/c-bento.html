<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд — Bento</title>
<style>
:root{--bg:#eceef2;--tx:#14161a;--mute:#6b7280;--g:#16a34a;--gt:#dcfce7;--b:#1d4ed8;--bt:#dbeafe;--r:#dc2626;--rt:#fee2e2;--w:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0c0d10;--tx:#f2f3f5;--mute:#8b909a;--g:#4ade80;--gt:#12301e;--b:#7aa2ff;--bt:#16233f;--r:#ff7b7b;--rt:#3a1717;--w:#17191e}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em}
.seg{display:inline-flex;background:var(--w);border-radius:14px;padding:4px;gap:2px;box-shadow:0 1px 2px #0001;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--mute);padding:8px 16px;border-radius:10px;font:500 14px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.tab.on{background:var(--tx);color:var(--bg)}.tab:not(.on):hover{color:var(--tx)}
.grid-b{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.t{background:var(--w);border-radius:28px;padding:22px 24px;box-shadow:0 1px 2px #0001;min-width:0}
.t h3{font-size:13px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.t.g{background:var(--gt)}.t.b{background:var(--bt)}.t.r{background:var(--rt)}
.t.g h3,.t.b h3,.t.r h3{color:inherit;opacity:.75}.t.g{color:var(--g)}.t.b{color:var(--b)}.t.r{color:var(--r)}
.num{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1}.num small{font-size:.38em;font-weight:600;opacity:.6;margin-left:6px;letter-spacing:0}
.big{grid-column:span 6;grid-row:span 1}.s4{grid-column:span 4}.s3{grid-column:span 3}.s8{grid-column:span 8}.s6{grid-column:span 6}.s12{grid-column:span 12}.s5{grid-column:span 5}.s7{grid-column:span 7}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#fff8;color:inherit}
.legend{display:flex;gap:12px;font-size:12px;font-weight:500;color:var(--mute)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
svg.chart{width:100%;height:auto;display:block}
.grid{stroke:color-mix(in srgb,var(--tx) 8%,transparent)}.zero{stroke:color-mix(in srgb,var(--tx) 25%,transparent)}.axis{fill:var(--mute);font:500 10px system-ui}.axis.val{fill:var(--tx);font-weight:700}
.c-found{fill:var(--b)}.c-spent{fill:var(--r)}.c-profit{fill:var(--g)}
.c-profit-line{stroke:var(--g);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.c-profit-dot{fill:var(--w);stroke:var(--g);stroke-width:1.8}.c-profit-area{fill:color-mix(in srgb,var(--g) 18%,transparent)}
.col .hit{fill:transparent}.col:hover .hit{fill:color-mix(in srgb,var(--tx) 5%,transparent)}
.mbar{opacity:.3}.mbar.on{opacity:1}
.ring{width:96px}.ring-bg{stroke:color-mix(in srgb,currentColor 18%,transparent)}.ring-fg{stroke:currentColor}
.rr{display:flex;align-items:center;gap:16px}.rr b{font-size:34px;letter-spacing:-.03em}
.mini{display:flex;flex-direction:column;justify-content:space-between;min-height:120px}
.mini .num{font-size:30px}.mini span{font-size:12px;color:var(--mute);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:600;font-size:12px;color:var(--mute);text-align:right;padding:6px 8px}th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:9px 8px;border-top:1px solid color-mix(in srgb,var(--tx) 7%,transparent)}
td.p{color:var(--g);font-weight:700}td.n{color:var(--r);font-weight:700}
.scroll{max-height:380px;overflow:auto}
.status{color:var(--mute);padding:90px 0;text-align:center;font-size:17px}
.foot{margin-top:16px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between}.foot button{background:none;border:0;color:var(--b);cursor:pointer;font:inherit;font-weight:600}
@media(max-width:860px){.grid-b>*{grid-column:span 12!important}}
</style></head><body><div class="wrap"><div id="app"></div></div>
<script src="shared/core.js"></script>
<script>
Dash.start((s,H)=>{
  const {fmt,short,pct}=H;
  const head=`<header><h1>${H.esc(s.project.name)}</h1>
    ${H.config.projects.length>1?`<div class="seg">${H.config.projects.map((p,i)=>`<button class="tab ${i===s.pi?'on':''}" data-project="${i}">${H.esc(p.name)}</button>`).join('')}</div>`:''}
    <div class="seg">${(s.months||s.project.months).map((m,i)=>`<button class="tab ${i===s.mi?'on':''}" data-month="${i}">${m.label}</button>`).join('')}</div></header>`;
  if(s.status==='loading')return head+'<div class="status">Загрузка…</div>';
  if(s.status==='error')return head+`<div class="status">Ошибка: ${H.esc(s.error)}<br><br><button class="tab on" data-refresh>Повторить</button></div>`;
  const m=s.month,x=m.summary,cur=s.project.currency,d=m.delta;
  const pill=d==null?'':`<span class="pill">${d>=0?'↑':'↓'} ${Math.abs(d*100).toFixed(0)}%</span>`;
  const rows=m.days.slice().reverse().map(r=>`<tr><td>${r.d}</td><td>${fmt(r.found)}</td><td>${fmt(r.spent)}</td><td class="${r.diff<0?'n':'p'}">${fmt(r.diff)}</td></tr>`).join('');
  const has=m.days.length>0;
  return head+`<div class="grid-b">
   <div class="t g s4"><h3>Чистая прибыль ${pill}</h3><div class="num">${fmt(x.profit)}<small>${cur}</small></div></div>
   <div class="t b s4"><h3>Всего найдено</h3><div class="num">${fmt(x.found)}<small>${cur}</small></div></div>
   <div class="t r s4"><h3>Реклама</h3><div class="num">${fmt(x.spent)}<small>${cur}</small></div></div>
   <div class="t s8"><h3>По дням <span class="legend"><span><i style="background:var(--b)"></i>найдено</span><span><i style="background:var(--r)"></i>реклама</span><span><i style="background:var(--g)"></i>прибыль</span></span></h3>${has?H.dailyChart(m.days,{height:250}):'<div class="status">Только итоги за месяц</div>'}</div>
   <div class="t s4" style="display:grid;gap:14px;align-content:start"><div class="t r" style="padding:18px"><h3>Доля рекламы</h3><div class="rr">${H.ring(m.adShare)}<b>${pct(m.adShare)}</b></div></div>
     <div class="t g" style="padding:18px"><h3>ROI</h3><div class="num">×${m.roi.toFixed(2)}</div></div></div>
   <div class="t s5"><h3>Прибыль по месяцам</h3>${H.monthsChart(s.months,m.key)}</div>
   ${has?`<div class="t s7"><h3>Накопленная прибыль</h3>${H.cumulativeChart(m.days,{height:170})}</div>
   <div class="t mini s3"><span>Средний день</span><div class="num">${short(m.avgProfit)}</div></div>
   <div class="t mini s3 g"><span style="color:inherit;opacity:.7">Лучший день · ${m.best.d}-е</span><div class="num">${short(m.best.diff)}</div></div>
   <div class="t mini s3 r"><span style="color:inherit;opacity:.7">Худший день · ${m.worst.d}-е</span><div class="num">${short(m.worst.diff)}</div></div>
   <div class="t mini s3"><span>Дней с данными</span><div class="num">${m.activeDays}</div></div>
   <div class="t s12"><h3>Все дни</h3><div class="scroll"><table><thead><tr><th>День</th><th>Найдено</th><th>Реклама</th><th>Прибыль</th></tr></thead><tbody>${rows}</tbody></table></div></div>`:''}
  </div><div class="foot"><span>Обновлено ${s.updated.toLocaleTimeString('ru-RU')} · Google Sheets</span><button data-refresh>Обновить</button></div>`;
});
</script></body></html>
