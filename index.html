const prevKeyOf=k=>{const [y,mo]=k.split('-').map(Number),d=new Date(y,mo-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const smooth=pts=>{if(pts.length<2)return '';let d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2,t=0.17;
 d+=' C'+(p1[0]+(p2[0]-p0[0])*t).toFixed(1)+','+(p1[1]+(p2[1]-p0[1])*t).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])*t).toFixed(1)+','+(p2[1]-(p3[1]-p1[1])*t).toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1)}return d};

const niceMax=v=>{if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
const cmpHTML=(m,H)=>{const pm=(Dash.state.months||[]).find(x=>x.key===prevKeyOf(m.key));if(!pm||!pm.days.length||!dayList(m).length)return '';

 let grid='';for(let i=0;i<=4;i++){const v=lo+span*i/4;grid+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${yv(v)}" y2="${yv(v)}"/><text class="ya" x="${pl-6}" y="${yv(v)+3.5}" text-anchor="end">${H.short(v)}</text>`}
 const ticks=[];for(let d=1;d<=N;d+=(N>28?2:1))ticks.push(d);if(!ticks.includes(N))ticks.push(N);
 let xa='';ticks.forEach(d=>{const lab=(d===1||d%5===0||d===N);xa+=`<line class="vl" x1="${x(d)}" x2="${x(d)}" y1="${pt}" y2="${pt+ih}"/>`+(lab?`<text class="xa" x="${x(d)}" y="${HT-8}" text-anchor="middle">${d}</text>`:'')});
 const pA=A.map(p=>[x(p.d),yv(p.v)]),pB=B.map(p=>[x(p.d),yv(p.v)]),pathA=smooth(pA),pathB=smooth(pB);
 const a=A[sd-1].v,b=B[Math.min(sd,pdim)-1].v,lastA=A[A.length-1],ahead=lastA.v>=B[Math.min(lastA.d,pdim)-1].v;
 const hit=A.map(p=>`<rect class="hit" data-day="${p.d}" x="${x(p.d)-iw/(N-1)/2}" y="${pt}" width="${iw/(N-1)}" height="${ih}"/>`).join('');
 const mk=`<line class="sx" x1="${x(sd)}" x2="${x(sd)}" y1="${pt}" y2="${pt+ih}"/><circle class="dB" cx="${x(sd)}" cy="${yv(b)}" r="3.8"/><circle class="dA" cx="${x(sd)}" cy="${yv(a)}" r="4.6"/>`;

 document.addEventListener('pointerup',e=>{const el=nameEl(e);if(!el||el.isContentEditable)return;const now=Date.now();if(now-lastT<400){lastT=0;edit(el)}else lastT=now});
 document.addEventListener('dblclick',e=>{const el=nameEl(e);if(el&&!el.isContentEditable)edit(el)});
 document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('[data-name]')){const r=document.createRange();r.selectNodeContents(e.target);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}});
})();
</script>
<script type="module" src="shared/sync.js"></script></body></html>
