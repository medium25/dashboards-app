<script src="shared/core.js?v=6"></script><script>
const f=n=>Dash.H.fmt(n);
const totals=m=>m.total&&m.total.found!=null?m.total:{found:m.days.reduce((a,x)=>a+x.found,0),spent:m.days.reduce((a,x)=>a+x.spent,0),diff:m.days.reduce((a,x)=>a+x.diff,0)};
let keepScroll=0;

let sel=null,selMonth=null;
const MN=['','янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const pick=m=>{ if(selMonth!==m.key){selMonth=m.key;sel=m.days.length?m.days[m.days.length-1].d:null} return m.days.find(x=>x.d===sel)||m.days[m.days.length-1]||null };
document.addEventListener('click',e=>{const t=e.target.closest('[data-day]');if(!t)return;sel=+t.dataset.day;Dash.redraw();});
const detail=(m,r,H,cur)=>{if(!r)return'';const w=H.weekday(m,r.d);return `<div class="card det ${w.weekend?'we':''}"><div class="dh"><div><div class="dd">${r.d} ${m.gen}</div><div class="dw">${w.full}</div></div></div><div class="rw"><span>Найдено</span><b class="b">${H.fmt(r.found)}</b></div><div class="rw"><span>Реклама</span><b class="r">${H.fmt(r.spent)}</b></div><div class="rw"><span>Прибыль</span><b class="${r.diff<0?'r':'g'}">${H.fmt(r.diff)}</b></div></div>`};

const stripHTML=(m,H,r)=>{const mx=Math.max(1,...m.days.map(x=>Math.abs(x.diff)));return `<div class="strip" id="strip">`+m.days.map(x=>{const w=H.weekday(m,x.d);return `<div class="col ${w.weekend?'we':''} ${x.d===r.d?'on':''}" data-day="${x.d}"><div class="t"><i class="${x.diff<0?'neg':''}" style="height:${Math.max(4,Math.abs(x.diff)/mx*92)}px"></i></div><span>${x.d}</span></div>`}).join('')+`</div>`};
const step=(dir)=>{const m=Dash.cur();if(!m)return;const i=m.days.findIndex(x=>x.d===sel)+dir;if(i>=0&&i<m.days.length){sel=m.days[i].d;Dash.redraw()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)step(+b.dataset.step)});
let tx=null;document.addEventListener('touchstart',e=>{if(e.target.closest('.det'))tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});
new MutationObserver(()=>{const s=document.getElementById('strip'),a=s&&s.querySelector('.col.on');if(a)s.scrollLeft=a.offsetLeft-(s.clientWidth-a.offsetWidth)/2}).observe(document.getElementById('app'),{childList:true});


let dOpen=false,fresh=false;
const secHTML=(m,H,c)=>{const r=pick(m),i=m.days.indexOf(r);return `<div class="sec">Листай день за днём</div>${stripHTML(m,H,r)}${detail(m,r,H,c)}<div class="nav"><button data-step="-1" ${i<=0?'disabled':''}>← Раньше</button><button data-step="1" ${i>=m.days.length-1?'disabled':''}>Позже →</button></div>`};
const setOpen=v=>{dOpen=v;fresh=v;Dash.redraw();fresh=false;document.body.classList.toggle('lock',dOpen&&true)};
document.addEventListener('click',e=>{if(e.target.closest('[data-toggle]')||e.target.matches('[data-close-bg]'))setOpen(!dOpen)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dOpen)setOpen(false)});

const dBtn=(m,H)=>{const last=m.days.slice(-14),mx=Math.max(1,...last.map(x=>Math.abs(x.diff)));
 return `<button class="dcard v1" data-toggle><div class="v1t"><span class="lb">По дням</span><i>→</i></div><div class="mini">${last.map(x=>`<u class="${x.diff<0?'neg':''}" style="height:${Math.max(4,Math.abs(x.diff)/mx*34)}px"></u>`).join('')}</div></button>`};
const daysBlock=(m,H,c)=>!m.days.length?'<div class="card"><div class="empty">Для этого месяца есть только итоги</div></div>':`${dBtn(m,H)}${dOpen?`<div class="pg ${fresh?'anim':''}"><div class="pgh"><button class="back" data-toggle>← Назад</button><b>${m.label}</b><span></span></div><div class="pgb">${secHTML(m,H,c)}</div></div>`:''}`;

const MNG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const plural=(n,a,b,c)=>{const x=n%100,y=n%10;return x>10&&x<20?c:y===1?a:y>1&&y<5?b:c};
function entryInfo(s){const now=new Date(),key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),today=now.getDate();
 const m=(s.months||[]).find(x=>x.key===key);
 if(!m||m.info==null)return{st:'na',m,today,missing:[],now,key};
 const filled=new Set(m.days.filter(x=>x.hasFound).map(x=>x.d));
 const missing=[];for(let d=1;d<today;d++)if(!filled.has(d))missing.push(d);
 const st=missing.length?'err':filled.has(today)?'ok':'warn';
 return{st,m,today,missing,now,key,todayFilled:filled.has(today)}}
const listDays=(arr,m)=>{const a=arr.slice(0,4).join(', ')+(arr.length>4?' и ещё '+(arr.length-4):'');return a+' '+MNG[+m.key.split('-')[1]-1]};


const INFOT=s=>{const I=entryInfo(s);const day=I.today+' '+(I.m?MNG[+I.m.key.split('-')[1]-1]:'');return{I,miss:I.m?listDays(I.missing,I.m):'',day}};

const inl=s=>{const {I,miss,day}=INFOT(s);if(I.st==='na')return '';const T={err:['Не внесено',miss,'Внести'],warn:['Сегодня',day+' · пока пусто','Внести'],ok:['Всё внесено','пропусков нет','Изменить']}[I.st];
 return `<div class="addrow st-${I.st}"><div class="at"><i class="dot"></i><div><b>${T[0]}</b><span>${T[1]}</span></div></div><button data-entry>${T[2]}</button></div>`};
const _unused=s=>{const I=entryInfo(s);const T={err:['⚠ Не внесено: '+(I.m?listDays(I.missing,I.m):''),'Внести'],warn:['Сегодня ещё не внесено','Внести'],ok:['✓ Всё внесено','Изменить'],na:['Нет вкладки месяца','']}[I.st];
 return `<div class="dock st-${I.st}"><div class="dt2">${T[0]}</div>${T[1]?`<button data-entry>${T[1]}</button>`:''}</div>`};


const BR=(()=>{const K='brand:v1';let d={};try{d=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
 return{d,get(k,def){return d[k]!=null&&d[k]!==''?d[k]:def},set(p){Object.assign(d,p);try{localStorage.setItem(K,JSON.stringify(d))}catch(e){};document.title=d.name||'Учёт'}}})();
const brandName=s=>BR.get('name',s.project.name);
if(BR.d.name)document.title=BR.d.name;
const brandH=(s,H)=>`<h1 class="br"><span class="bn3" contenteditable="false" title="Двойное нажатие — изменить" spellcheck="false" autocapitalize="sentences" enterkeyhint="done" data-name>${H.esc(brandName(s))}</span></h1>`;
Dash.start((s,H)=>{
  const top=`<div class="top">${brandH(s,H)}
    ${H.config.projects.length>1?`<div class="tabs proj">${H.config.projects.map((p,i)=>`<button class="tab ${i===s.pi?'on':''}" data-project="${i}">${H.esc(p.name)}</button>`).join('')}</div>`:''}
    <div class="tabs" id="months">${(s.months||s.project.months).map((m,i)=>`<button class="tab ${i===s.mi?'on':''}" data-month="${i}">${m.label}</button>`).reverse().join('')}</div></div>`;
  if(s.status==='loading')return top+'<div class="status">Загрузка…</div>';
  if(s.status==='error')return top+`<div class="status err">Ошибка: ${H.esc(s.error)}<br><br><button class="tab on" data-refresh>Повторить</button></div>`;
  const m=s.month,x=m.summary,c=s.project.currency,t=totals(m);
  const rows=m.days.map(r=>{const w=H.weekday(m,r.d);return `<div class="ri ${w.weekend?'we':''}"><div class="dt">${r.d} ${m.gen}<span class="wd">${w.short}</span></div><div class="c f">${f(r.found)}</div><div class="c s">${f(r.spent)}</div><div class="c ${r.diff<0?'n':'p'}">${f(r.diff)}</div></div>`}).join('');
  const lkI=entryInfo(s),lk=lkI.st==='err',lkMiss=lk?listDays(lkI.missing,lkI.m):'';
  return top+`
  <div class="grp${lk?' lkg':''}">
  <div class="card hero"><h3>Чистая прибыль</h3><div class="num g glow-g">${f(x.profit)}<small>${c}</small></div></div>
  <div class="two"><div class="card"><h3>Найдено</h3><div class="num b glow-b">${f(x.found)}<small>${c}</small></div></div>
    <div class="card"><h3>Реклама</h3><div class="num r glow-r">${f(x.spent)}<small>${c}</small></div></div></div>
  ${lk?`<div class="peekhint">⚠ Данные неполные: ${lkMiss}. Зажми, чтобы подсмотреть</div>`:''}</div>
  ${daysBlock(m,H,c)}
  ${inl(s)}
  <div class="foot"><span class="${s.offline?'off':''}">Обновлено ${s.updated.toLocaleTimeString('ru-RU')}${s.offline?' · офлайн, данные сохранены':''}</span><button data-refresh>↻ Обновить</button></div>`;
});
// keep active month chip visible in the scroller after re-render
new MutationObserver(()=>{const c=document.getElementById('months'),a=c&&c.querySelector('.tab.on');if(a)c.scrollLeft=a.offsetLeft-(c.clientWidth-a.offsetWidth)/2}).observe(document.getElementById('app'),{childList:true});
</script>
<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ttl"><div class="grab"></div>
<h2 id="ttl">Внести «найдено»</h2><div class="sub" id="sub"></div>
<div class="dchips" id="dchips"></div>
<label class="inp"><input id="amt" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Сумма"><span>so'm</span></label>
<div class="cur" id="cur"></div>
<div class="mode" id="mode"><button data-m="set" class="on">Заменить</button><button data-m="add">Добавить к сумме</button></div>
<div class="msg" id="msg"></div>
<button class="save" id="save" disabled>Сохранить</button><button class="cancel" id="cancel">Отмена</button></div></div>
<div id="inst" role="note"><div class="ic2"></div><p><b>Установи как приложение.</b> Нажми <svg class="sh" viewBox="0 0 24 24" fill="none" stroke="#7fb0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></svg> «Поделиться», затем <b>«На экран «Домой»»</b>.</p><button id="instx">Понятно</button></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),D=()=>window.Dash,WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
let mode='set',busy=false,target=null;const done=new Set();
const digits=s=>String(s).replace(/\D/g,''),fmt=n=>D().H.fmt(n);
const info=()=>{const I=entryInfo(D().state);I.missing=I.missing.filter(d=>!done.has(d));return I};
function note(k,t){$('msg').className='msg '+k;$('msg').textContent=t}
function render(){const I=info();if(!I.m){$('dchips').innerHTML='';$('sub').textContent='';$('cur').textContent='';note('err','В настройках нет месяца '+I.key+'. Добавь его в shared/core.js.');$('save').disabled=true;return}
 const days=[...I.missing];if(!days.includes(I.today))days.push(I.today);if(!days.includes(target))target=days[0];
 const mn=MNG[+I.key.split('-')[1]-1];
 $('dchips').innerHTML=days.map(d=>'<button data-d="'+d+'" class="'+(d===target?'on ':'')+(I.missing.includes(d)?'miss':'')+'">'+d+' '+mn.slice(0,3)+(d===I.today?' · сегодня':'')+'</button>').join('');
 const dt=new Date(I.now.getFullYear(),I.now.getMonth(),target);$('sub').textContent=target+' '+mn+', '+WD[dt.getDay()];$('sub').className='sub'+([0,6].includes(dt.getDay())?' we':'');
 const row=I.m.days.find(x=>x.d===target&&x.hasFound);$('cur').innerHTML=row?'Сейчас в таблице: <b>'+fmt(row.found)+'</b>':'<span class="bad">Этот день не заполнен</span>';
 const proj=D().H.config.projects[D().state.pi];
 if(I.m.info==null)note('err','У этого месяца нет вкладки с данными по дням — писать некуда.');
 else if(!proj.scriptUrl)note('info','Чтобы запись шла в Google Таблицу, подключи скрипт (apps-script/Code.gs). Пока сохранить нельзя.');
 else if(I.missing.length)note('err','Не заполнено: '+listDays(I.missing,I.m)+'. Пока есть пропуски, итоги неверные.');
 else $('msg').className='msg';
 $('amt').value='';$('save').disabled=true}
function open(pref){done.clear();target=pref||null;const I=info();if(I.missing.length&&!target)target=I.missing[0];if(!target)target=I.today;render();$('ov').classList.add('open');setTimeout(()=>$('amt').focus(),60)}
const close=()=>$('ov').classList.remove('open');
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2800)}
document.addEventListener('click',e=>{if(e.target.closest('[data-entry]'))open()});
$('cancel').onclick=close;$('ov').onclick=e=>{if(e.target===$('ov'))close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&$('ov').classList.contains('open'))save()});
$('dchips').onclick=e=>{const b=e.target.closest('button');if(!b)return;target=+b.dataset.d;render();$('amt').focus()};
$('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...$('mode').children].forEach(x=>x.classList.toggle('on',x===b))};
$('amt').oninput=e=>{const d=digits(e.target.value).replace(/^0+(?=\d)/,'');e.target.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,' '):'';
  const I=info(),proj=D().H.config.projects[D().state.pi];$('save').disabled=!d||!I.m||I.m.info==null||!proj.scriptUrl};
async function save(){if(busy||$('save').disabled)return;const I=info(),proj=D().H.config.projects[D().state.pi],v=+digits($('amt').value);
  busy=true;$('save').textContent='Сохраняю…';$('save').disabled=true;
  try{const r=await fetch(proj.scriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:proj.token,gid:I.m.info,day:target,value:v,mode})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'ошибка');
    done.add(target);navigator.vibrate&&navigator.vibrate(25);toast(target+' '+MNG[+I.key.split('-')[1]-1]+': '+fmt(j.value)+" so'm");setTimeout(()=>D().reload({silent:true}),1200);
    const left=info();if(left.missing.length){target=left.missing[0];render()}else close();
  }catch(e){navigator.vibrate&&navigator.vibrate([60,40,60]);note('err','Не удалось сохранить: '+e.message+'. Проверь ссылку и токен скрипта.');$('save').disabled=false}
  busy=false;$('save').textContent='Сохранить'}
$('save').onclick=save;
})();
</script>
<script>
// phone helpers: keep the entry sheet above the on-screen keyboard, pull-to-refresh, offline-capable shell
(()=>{const vv=window.visualViewport,root=document.documentElement;
 if(vv){const f=()=>root.style.setProperty('--kb',Math.max(0,innerHeight-vv.height-vv.offsetTop)+'px');vv.addEventListener('resize',f);vv.addEventListener('scroll',f);f()}
 let y0=null,pull=0;const el=document.createElement('div');el.id='ptr';document.body.appendChild(el);
 const blocked=()=>document.body.classList.contains('lock')||document.querySelector('.pg')||document.getElementById('ov').classList.contains('open');
 addEventListener('touchstart',e=>{y0=(scrollY<=0&&!blocked())?e.touches[0].clientY:null},{passive:true});
 addEventListener('touchmove',e=>{if(y0==null)return;pull=Math.max(0,e.touches[0].clientY-y0);el.style.transform='translate(-50%,'+(Math.min(pull,90)-60)+'px)';el.textContent=pull>80?'Отпусти — обновлю':'Потяни, чтобы обновить';el.style.opacity=Math.min(1,pull/60)},{passive:true});
 addEventListener('touchend',async()=>{if(y0==null)return;const go=pull>80;y0=null;pull=0;if(go){el.textContent='Обновляю…';el.style.transform='translate(-50%,16px)';await Dash.reload({silent:true});navigator.vibrate&&navigator.vibrate(15)}el.style.opacity=0;el.style.transform='translate(-50%,-60px)'});

 // iOS has no install prompt: show a one-time hint with the manual steps
 (()=>{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  let dismissed=false;try{dismissed=localStorage.getItem('instHint')==='1'}catch(e){}
  const force=location.search.includes('ioshint');
  if(!force&&(!ios||standalone||dismissed))return;
  const box=document.getElementById('inst');setTimeout(()=>box.classList.add('show'),2500);
  document.getElementById('instx').onclick=()=>{box.classList.remove('show');try{localStorage.setItem('instHint','1')}catch(e){}};})();
 if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
<script>
(()=>{const on=e=>{const g=e.target.closest&&e.target.closest('.lkg');if(g)g.classList.add('peek')};
 const off=()=>document.querySelectorAll('.lkg.peek').forEach(g=>g.classList.remove('peek'));
 document.addEventListener('pointerdown',on);['pointerup','pointercancel','touchend','touchcancel','blur'].forEach(ev=>addEventListener(ev,off));
 document.addEventListener('contextmenu',e=>{if(e.target.closest('.lkg'))e.preventDefault()});})();
</script><script>
(()=>{
 const save=el=>{const v=el.textContent.replace(/\s+/g,' ').trim().slice(0,20);BR.set({name:v});Dash.redraw()};
 document.addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('[data-name]')&&e.key==='Enter'){e.preventDefault();e.target.blur()}});
 document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('[data-name]'))save(e.target)});
 let lastT=0;const nameEl=e=>e.target.closest&&e.target.closest('[data-name]');
 const edit=el=>{el.setAttribute('contenteditable','plaintext-only');el.focus()};
 document.addEventListener('pointerup',e=>{const el=nameEl(e);if(!el||el.isContentEditable)return;const now=Date.now();if(now-lastT<400){lastT=0;edit(el)}else lastT=now});
 document.addEventListener('dblclick',e=>{const el=nameEl(e);if(el&&!el.isContentEditable)edit(el)});
 document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('[data-name]')){const r=document.createRange();r.selectNodeContents(e.target);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}});
})();
</script></body></html>
