<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Учёт</title><link rel="stylesheet" href="shared/neon.css">
<style>
html{-webkit-text-size-adjust:100%}html,body{overflow-x:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior-y:none}
.wrap{max-width:760px;padding:14px 14px 40px}
header{display:block;margin-bottom:12px}
.top{position:sticky;top:0;z-index:5;margin:0 -14px 12px;padding:10px 14px 10px;background:linear-gradient(#070a10 70%,#070a1000)}
.top h1{font-size:24px;margin-bottom:10px}.top h1 i{width:24px;height:24px;border-radius:7px}
.tabs{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 18px;scroll-snap-align:start;-webkit-tap-highlight-color:transparent}
.tab:active{transform:scale(.96)}
.tabs.proj{margin-bottom:8px}
.hero{padding:22px 20px 20px;margin-bottom:10px}
.hero::after{content:'';position:absolute;right:-20%;bottom:-80%;width:80%;height:150%;background:radial-gradient(closest-side,#2bff8833,transparent);pointer-events:none}
.hero .num{font-size:clamp(36px,12vw,56px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.two .card{padding:16px 16px 18px;border-radius:20px}
.two .num{font-size:clamp(19px,6vw,28px);white-space:nowrap}.two .num small{display:block;margin:5px 0 0;font-size:12px}
.two h3{margin-bottom:10px;font-size:11px}
.list{padding:6px 6px 4px;border-radius:24px}
.lh{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;padding:10px 12px;color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.lh span:not(:first-child),.ri .c{text-align:right}
.ri{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:12px;border-bottom:1px solid #121a27;font-variant-numeric:tabular-nums}
.ri:last-child{border-bottom:0}
.ri .dt{font-weight:600}
.wd{margin-left:8px;font-size:12px;font-weight:700;color:var(--mute);background:#ffffff0d;padding:2px 8px;border-radius:99px}.we .wd{color:var(--r);background:#ff4d5e1c}
.ri .f{color:var(--b)}.ri .s{color:var(--r)}.ri .p{color:var(--g);font-weight:800}.ri .n{color:var(--r);font-weight:800}
.ri .c small{display:none}
.tot{margin:4px 0 2px;border-radius:16px;background:#ffffff08;border-top:0;font-weight:800}
.tot .dt{font-weight:800}
.empty{padding:50px 16px;text-align:center;color:var(--mute)}
.foot{padding:0 4px}
/* phone: each day = 2 lines, no horizontal squeeze */
@media(max-width:560px){
  .lh{display:none}
  .ri{grid-template-columns:1fr auto;grid-template-areas:"d p" "f s";row-gap:5px;column-gap:10px;padding:13px 12px}
  .ri .dt{grid-area:d;font-size:16px}
  .ri .p,.ri .n{grid-area:p;text-align:right;font-size:18px}
  .ri .f{grid-area:f;text-align:left;font-size:13px}
  .ri .s{grid-area:s;text-align:right;font-size:13px}
  .ri .f::before{content:'найдено ';color:var(--mute)}
  .ri .s::before{content:'реклама ';color:var(--mute)}
  .tot{grid-template-areas:"d p" "f s"}
}

.det{padding:18px 18px 16px;margin-bottom:12px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dd{font-size:20px;font-weight:800;letter-spacing:-.02em}.dw{color:var(--mute);font-size:14px;margin-top:2px}.det.we .dw{color:var(--r)}
.dp{font-size:clamp(26px,8vw,36px);font-weight:800;letter-spacing:-.03em;text-align:right;font-variant-numeric:tabular-nums}.dp small{display:block;font-size:12px;color:var(--mute);font-weight:600;letter-spacing:0}
.dr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.dr>div{background:#ffffff08;border-radius:14px;padding:10px 12px}.dr span{display:block;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}.dr b{font-size:17px;font-variant-numeric:tabular-nums}
.sec{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:4px 4px 10px}

.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 12px;margin:0 -14px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.col{flex:0 0 38px;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:6px 0 8px;border-radius:14px;border:1px solid transparent}
.col .t{height:92px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.col .t i{display:block;width:20px;border-radius:7px 7px 4px 4px;background:linear-gradient(#2bff88,#14a85a);min-height:4px;opacity:.55}
.col .t i.neg{background:linear-gradient(#ff4d5e,#a82333)}
.col span{font-size:13px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}.col.we span{color:var(--r)}
.col.on{background:#ffffff0c;border-color:#2c3a52}.col.on .t i{opacity:1;box-shadow:0 0 14px #2bff8888}.col.on span{color:var(--tx)}
.nav{display:flex;gap:10px;margin-top:12px}.nav button{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:#ffffff08;color:var(--tx);font:700 15px inherit;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.nav button:active{transform:scale(.97)}.nav button:disabled{opacity:.3}
.tx{color:var(--tx)}.rw{display:flex;justify-content:space-between;align-items:baseline;padding:15px 2px;border-top:1px solid var(--line)}.rw:first-of-type{margin-top:14px}.rw span{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}.rw b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}.rw b::after{content:" so'm";font-size:12px;font-weight:600;color:var(--mute);letter-spacing:0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:20;min-height:52px;padding:0 22px 0 18px;border-radius:99px;border:0;background:var(--g);color:#04120a;font:800 16px inherit;font-family:inherit;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px #2bff8855,0 2px 8px #0008;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fab:active{transform:scale(.96)}.fab b{font-size:24px;line-height:1;margin-top:-2px}
.wrap{padding-bottom:100px}
.ov{position:fixed;inset:0;z-index:30;background:#000a;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ov.open{display:flex}
.sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#131a28,#0d121b);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:9px;background:#2c3a52;margin:0 auto 16px}
.sheet h2{font-size:20px;font-weight:800;letter-spacing:-.02em}.sheet .sub{color:var(--mute);font-size:14px;margin:3px 0 16px}
.sheet .sub.we{color:var(--r)}
.inp{display:flex;align-items:baseline;gap:10px;background:#ffffff08;border:1px solid var(--line);border-radius:18px;padding:14px 16px}.inp:focus-within{border-color:var(--b);box-shadow:0 0 0 3px #3d8bff33}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--b);font:800 clamp(28px,9vw,38px) inherit;font-family:inherit;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.inp input::placeholder{color:#3b4a63}.inp span{color:var(--mute);font-weight:600}
.cur{margin:10px 2px 0;color:var(--mute);font-size:13px}.cur b{color:var(--tx)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#ffffff08;border-radius:14px;padding:4px;margin-top:14px}
.mode button{min-height:40px;border:0;border-radius:11px;background:none;color:var(--mute);font:600 14px inherit;font-family:inherit;cursor:pointer}.mode button.on{background:#ffffff14;color:var(--tx)}
.save{width:100%;min-height:54px;margin-top:16px;border:0;border-radius:16px;background:var(--b);color:#fff;font:800 17px inherit;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.save:disabled{opacity:.4}.save:active:not(:disabled){transform:scale(.98)}
.cancel{width:100%;min-height:44px;margin-top:6px;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;cursor:pointer}
.msg{margin-top:12px;font-size:13px;line-height:1.45;border-radius:12px;padding:10px 12px;display:none}.msg.err{display:block;background:#ff4d5e18;color:#ff9aa4}.msg.info{display:block;background:#3d8bff18;color:#9dc0ff}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#16301f;color:var(--g);border:1px solid #2bff8855;padding:11px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%)}
</style></head><body><div class="wrap"><div id="app"></div></div>
<script src="shared/core.js?v=4"></script><script>
const f=n=>Dash.H.fmt(n);
const totals=m=>m.total&&m.total.found!=null?m.total:{found:m.days.reduce((a,x)=>a+x.found,0),spent:m.days.reduce((a,x)=>a+x.spent,0),diff:m.days.reduce((a,x)=>a+x.diff,0)};
let keepScroll=0;

let sel=null,selMonth=null;
const MN=['','янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const pick=m=>{ if(selMonth!==m.key){selMonth=m.key;sel=m.days.length?m.days[m.days.length-1].d:null} return m.days.find(x=>x.d===sel)||m.days[m.days.length-1]||null };
document.addEventListener('click',e=>{const t=e.target.closest('[data-day]');if(!t)return;sel=+t.dataset.day;Dash.redraw();});
const detail=(m,r,H,cur)=>{if(!r)return'';const w=H.weekday(m,r.d);return `<div class="card det ${w.weekend?'we':''}"><div class="dh"><div><div class="dd">${r.d} ${m.gen}</div><div class="dw">${w.full}</div></div></div><div class="rw"><span>Найдено</span><b class="b">${H.fmt(r.found)}</b></div><div class="rw"><span>Реклама</span><b class="r">${H.fmt(r.spent)}</b></div><div class="rw"><span>Прибыль</span><b class="${r.diff<0?'r':'g'}">${H.fmt(r.diff)}</b></div></div>`};

const stripHTML=(m,H,r)=>{const mx=Math.max(1,...m.days.map(x=>Math.abs(x.diff)));return `<div class="strip" id="strip">`+m.days.map(x=>{const w=H.weekday(m,x.d);return `<div class="col ${w.weekend?'we':''} ${x.d===r.d?'on':''}" data-day="${x.d}"><div class="t"><i class="${x.diff<0?'neg':''}" style="height:${Math.max(4,Math.abs(x.diff)/mx*92)}px"></i></div><span>${x.d}</span></div>`}).join('')+`</div>`};
const step=(dir)=>{const m=Dash.cur();if(!m)return;const i=m.days.findIndex(x=>x.d===sel)+dir;if(i>=0&&i<m.days.length){sel=m.days[i].d;Dash.redraw()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)step(+b.dataset.step)});
let tx=null;document.addEventListener('touchstart',e=>{if(e.target.closest('.det'))tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});
new MutationObserver(()=>{const s=document.getElementById('strip'),a=s&&s.querySelector('.col.on');if(a)s.scrollLeft=a.offsetLeft-(s.clientWidth-a.offsetWidth)/2}).observe(document.getElementById('app'),{childList:true});

Dash.start((s,H)=>{
  const top=`<div class="top"><h1><i></i>${H.esc(s.project.name)}</h1>
    ${H.config.projects.length>1?`<div class="tabs proj">${H.config.projects.map((p,i)=>`<button class="tab ${i===s.pi?'on':''}" data-project="${i}">${H.esc(p.name)}</button>`).join('')}</div>`:''}
    <div class="tabs" id="months">${(s.months||s.project.months).map((m,i)=>`<button class="tab ${i===s.mi?'on':''}" data-month="${i}">${m.label}</button>`).join('')}</div></div>`;
  if(s.status==='loading')return top+'<div class="status">Загрузка…</div>';
  if(s.status==='error')return top+`<div class="status err">Ошибка: ${H.esc(s.error)}<br><br><button class="tab on" data-refresh>Повторить</button></div>`;
  const m=s.month,x=m.summary,c=s.project.currency,t=totals(m);
  const rows=m.days.map(r=>{const w=H.weekday(m,r.d);return `<div class="ri ${w.weekend?'we':''}"><div class="dt">${r.d} ${m.gen}<span class="wd">${w.short}</span></div><div class="c f">${f(r.found)}</div><div class="c s">${f(r.spent)}</div><div class="c ${r.diff<0?'n':'p'}">${f(r.diff)}</div></div>`}).join('');
  return top+`
  <div class="card hero"><h3>Чистая прибыль</h3><div class="num g glow-g">${f(x.profit)}<small>${c}</small></div></div>
  <div class="two"><div class="card"><h3>Найдено</h3><div class="num b glow-b">${f(x.found)}<small>${c}</small></div></div>
    <div class="card"><h3>Реклама</h3><div class="num r glow-r">${f(x.spent)}<small>${c}</small></div></div></div>
  ${m.days.length?(()=>{const r=pick(m);const i=m.days.indexOf(r);return `<div class="sec">Листай день за днём</div>${stripHTML(m,H,r)}${detail(m,r,H,c)}<div class="nav"><button data-step="-1" ${i<=0?'disabled':''}>← Раньше</button><button data-step="1" ${i>=m.days.length-1?'disabled':''}>Позже →</button></div>`})():'<div class="card"><div class="empty">Для этого месяца есть только итоги</div></div>'}
  <div class="foot"><span>Обновлено ${s.updated.toLocaleTimeString('ru-RU')}</span><button data-refresh>↻ Обновить</button></div>`;
});
// keep active month chip visible in the scroller after re-render
new MutationObserver(()=>{const c=document.getElementById('months'),a=c&&c.querySelector('.tab.on');if(a)c.scrollLeft=a.offsetLeft-(c.clientWidth-a.offsetWidth)/2}).observe(document.getElementById('app'),{childList:true});
</script>
<button class="fab" id="fab"><b>+</b>Найдено сегодня</button>
<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ttl"><div class="grab"></div>
<h2 id="ttl">Найдено сегодня</h2><div class="sub" id="sub"></div>
<label class="inp"><input id="amt" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Сумма"><span>so'm</span></label>
<div class="cur" id="cur"></div>
<div class="mode" id="mode"><button data-m="set" class="on">Заменить</button><button data-m="add">Добавить к сумме</button></div>
<div class="msg" id="msg"></div>
<button class="save" id="save" disabled>Сохранить</button><button class="cancel" id="cancel">Отмена</button></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id), D=()=>window.Dash, MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
let mode='set',busy=false;
const digits=s=>String(s).replace(/\D/g,''),fmt=n=>D().H.fmt(n);
function ctx(){const now=new Date(),key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),st=D().state;
  const months=st.months||[],m=months.find(x=>x.key===key),proj=D().H.config.projects[st.pi];
  return {now,key,m,proj,day:now.getDate()}}
function open(){const c=ctx();$('msg').className='msg';$('amt').value='';$('save').disabled=true;
  const we=[0,6].includes(c.now.getDay());$('sub').textContent=c.day+' '+MN[c.now.getMonth()]+', '+WD[c.now.getDay()];$('sub').className='sub'+(we?' we':'');
  const cur=c.m&&c.m.days.find(x=>x.d===c.day);$('cur').innerHTML=cur?'Сейчас в таблице: <b>'+fmt(cur.found)+'</b>':'За сегодня в таблице пока пусто';
  if(!c.m){info('err','В настройках нет месяца '+c.key+'. Добавь его в shared/core.js.')}
  else if(c.m.info==null){info('err','У этого месяца нет вкладки с данными по дням — писать некуда.')}
  else if(!c.proj.scriptUrl){info('info','Чтобы запись шла в Google Таблицу, подключи скрипт: инструкция в apps-script/Code.gs. Пока ссылка не указана, сохранить нельзя.')}
  $('ov').classList.add('open');setTimeout(()=>$('amt').focus(),60)}
function info(k,t){$('msg').className='msg '+k;$('msg').textContent=t}
function close(){$('ov').classList.remove('open')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
$('fab').onclick=open;$('cancel').onclick=close;$('ov').onclick=e=>{if(e.target===$('ov'))close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&$('ov').classList.contains('open'))save()});
$('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...$('mode').children].forEach(x=>x.classList.toggle('on',x===b))};
$('amt').oninput=e=>{const d=digits(e.target.value).replace(/^0+(?=\d)/,'');e.target.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,' '):'';
  const c=ctx();$('save').disabled=!d||!c.m||c.m.info==null||!c.proj.scriptUrl;if($('msg').classList.contains('err'))$('msg').className='msg'};
async function save(){if(busy||$('save').disabled)return;const c=ctx(),v=+digits($('amt').value);if(!v&&v!==0)return;
  busy=true;$('save').textContent='Сохраняю…';$('save').disabled=true;
  try{
    const r=await fetch(c.proj.scriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.proj.token,gid:c.m.info,day:c.day,value:v,mode})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'ошибка');
    close();toast('Сохранено: '+fmt(j.value)+" so'm");
    setTimeout(()=>{D().reload()},1200);
  }catch(e){info('err','Не удалось сохранить: '+e.message+'. Проверь ссылку и токен скрипта.');$('save').disabled=false}
  busy=false;$('save').textContent='Сохранить'}
$('save').onclick=save;
})();
</script>
</body></html>
