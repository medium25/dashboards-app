<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Палитры панели — 3 варианта</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#05070b;color:#f2f5fa;font:15px/1.3 -apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;padding:24px 16px 60px;-webkit-font-smoothing:antialiased}
h1{font-size:15px;font-weight:600;color:#8b96aa;text-align:center;margin-bottom:22px}
.row{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}.col{width:300px}
.lab{font-size:13px;font-weight:700;color:#8b96aa;text-align:center;margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase}
.app{position:relative;height:560px;border-radius:26px;overflow:hidden;border:1px solid #ffffff1c;background:radial-gradient(400px 260px at 90% -10%,#12304a88,transparent),radial-gradient(300px 260px at 0% 20%,#0f3a2a77,transparent),#0a0e16;box-shadow:0 30px 80px #000c}
.app .mock{position:absolute;inset:20px 14px 14px 250px;display:flex;flex-direction:column;gap:10px;opacity:.5}.app .mock i{display:block;border-radius:16px;background:#ffffff0c;border:1px solid #ffffff10;height:60px}
.rail{position:absolute;left:0;top:0;bottom:0;width:244px;padding:62px 10px 10px;display:flex;flex-direction:column;gap:2px;background:#1b2130d9;border-right:1px solid #ffffff14;backdrop-filter:blur(40px) saturate(1.8)}
.x{position:absolute;left:12px;top:12px;width:40px;height:40px;border-radius:12px;background:#ffffff14;display:grid;place-items:center;font-size:18px;color:#f2f5fa}
.sec{display:flex;justify-content:space-between;padding:0 8px;height:26px;font-size:11px;font-weight:600;color:#ffffff66;letter-spacing:.04em}
.rw{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 9px;border-radius:12px}
.rw .t{flex:1;font-size:15px;font-weight:500}.rw .m{color:#8b96aa;width:28px;text-align:center}
.lt{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 2px #0005;box-shadow:inset 0 1px 0 #ffffff66,inset 0 -6px 10px #0002,0 4px 14px var(--g,#0006)}
.sp{flex:1}.foot{border-top:1px solid #ffffff12;padding-top:6px;color:#c8d0df}
/* palette 1 */
.p1 .c0{background:linear-gradient(135deg,#40a0ff,#5e5ce6);--g:#3b82ff88}.p1 .c1{background:linear-gradient(135deg,#3be07a,#00b36b);--g:#10d97a88}.p1 .c2{background:linear-gradient(135deg,#ffb020,#ff453a);--g:#ff7a2088}.p1 .c3{background:linear-gradient(135deg,#ff4f8b,#bf5af2);--g:#e04fd088}
.p1 .on{background:linear-gradient(90deg,#0a84ffcc,#5e5ce6aa)}
/* palette 2 */
.p2 .rail{background:#070d16e6}
.p2 .c0{background:linear-gradient(135deg,#00f0ff,#2f6bff);--g:#00e5ff99}.p2 .c1{background:linear-gradient(135deg,#c6ff3d,#00d45a);--g:#7dff4a88}.p2 .c2{background:linear-gradient(135deg,#ff2d95,#7c4dff);--g:#ff2d9599}.p2 .c3{background:linear-gradient(135deg,#ffe600,#ff6a00);--g:#ffb80099}
.p2 .lt{color:#06101a;text-shadow:none}.p2 .on{background:#00e5ff14;box-shadow:inset 0 0 0 1px #00e5ff99,0 0 22px #00e5ff44}
/* palette 3 */
.p3 .rail{background:#1c1622e6}
.p3 .c0{background:linear-gradient(135deg,#ff8a5c,#ff3d71);--g:#ff5a7a88}.p3 .c1{background:linear-gradient(135deg,#ffc15a,#ff8a2a);--g:#ffa03a88}.p3 .c2{background:linear-gradient(135deg,#34e0c8,#0ea5e9);--g:#1fc8d888}.p3 .c3{background:linear-gradient(135deg,#b69cff,#6d5cff);--g:#8a7aff88}
.p3 .on{background:linear-gradient(90deg,#ff3d7155,#6d5cff55)}
</style></head><body>
<h1>Цвета боковой панели · три палитры</h1>
<div class="row" id="r"></div>
<script>
const P=[['1 · Яркие градиенты','p1'],['2 · Неон','p2'],['3 · Тёплый закат','p3']],B=['Учёт','Магазин 2','Кафе','Склад'];
document.getElementById('r').innerHTML=P.map(([n,c])=>`<div class="col ${c}"><div class="lab">${n}</div><div class="app"><div class="mock"><i></i><i></i><i></i><i></i><i></i></div><div class="rail"><div class="x">✕</div><div class="sec"><span>БИЗНЕСЫ</span><span>＋</span></div>${B.map((b,i)=>`<div class="rw ${i===0?'on':''}"><span class="lt c${i}">${b[0]}</span><span class="t">${b}</span><span class="m">⋯</span></div>`).join('')}<div class="sp"></div><div class="foot"><div class="rw"><span class="t">⚙  Настройки</span></div></div></div></div></div>`).join('');
</script></body></html>
